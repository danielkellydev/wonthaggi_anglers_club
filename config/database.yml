default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: wonthaggi_angling_club_development

test:
  <<: *default
  database: wonthaggi_angling_club_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
